<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medical Flashcards</title>
<style>
:root{--green:#234936;--sage:#718866;--cream:#f7f3ea;--paper:#fffdf8;--pink:#d96d9b;--soft:#f2d2df;--ink:#20251f;--muted:#687067}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,#f7f3ea,#e8eee7);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
button{font:inherit}.page{max-width:800px;margin:auto;padding:24px 16px 50px}
header{text-align:center;margin:10px 0 24px} h1{margin:0;color:var(--green);font-size:32px}.sub{color:var(--muted);margin-top:6px}
.home{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin:35px auto;max-width:650px}
.subject{border:0;border-radius:24px;min-height:210px;background:var(--paper);box-shadow:0 15px 40px #00000012;border:1px solid #ffffff;cursor:pointer;transition:.2s;display:flex;flex-direction:column;align-items:center;justify-content:center}
.subject:hover{transform:translateY(-4px)} .emoji{font-size:55px}.subject h2{margin:10px 0 4px;color:var(--green)} .count{color:var(--muted)}
.global{display:flex;justify-content:center;margin-top:16px}.star-link{border:1px solid var(--pink);background:#fff7fb;color:#a84370;border-radius:999px;padding:10px 18px;cursor:pointer;font-weight:700}
#study{display:none}.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.back{border:0;background:transparent;color:var(--green);font-weight:700;cursor:pointer;padding:8px 4px}.title{font-weight:800;font-size:20px;margin-right:auto}.starcount{font-size:13px;color:var(--muted)}
.filters{display:none;gap:7px;flex-wrap:wrap;margin:12px 0}.chip{border:1px solid #cbd3c8;background:#ffffff99;border-radius:999px;padding:7px 11px;color:#536052;cursor:pointer;font-size:12px}.chip.active{background:var(--green);border-color:var(--green);color:#fff}
.progress{display:flex;align-items:center;gap:10px;margin:14px 0}.progress span{font-size:12px;color:var(--muted);white-space:nowrap}.track{height:7px;flex:1;background:#dce2da;border-radius:9px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--sage),var(--pink));width:0}
.stage{perspective:1400px;position:relative;margin:20px 0 18px}.card{height:430px;position:relative;transform-style:preserve-3d;transition:transform .55s;cursor:pointer}.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;padding:32px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 18px 45px #00000018}.front{background:var(--paper)}.back{background:var(--green);color:#fff;transform:rotateY(180deg)}
.kicker{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--pink);font-weight:800;margin-bottom:16px}.back .kicker{color:var(--soft)}
.q{font-size:24px;line-height:1.4;font-weight:750}.a{font-size:18px;line-height:1.6;white-space:pre-line}.hint{margin-top:20px;font-size:13px;color:#889087}.back .hint{color:#cdd7d0}
.stem{display:none;background:#edf1eb;border-left:4px solid var(--sage);padding:11px 14px;border-radius:8px;margin-bottom:10px;font-size:13px;line-height:1.5}.stem.show{display:block}
.star{position:absolute;right:-5px;top:-8px;z-index:5;width:44px;height:44px;border-radius:50%;border:1px solid #d8ded5;background:#fff;color:#a0aaa0;cursor:pointer;font-size:21px}.star.on{color:var(--pink);background:var(--soft);border-color:var(--pink)}
.controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.btn{border:1px solid #d3dad0;background:#fff;border-radius:12px;padding:11px 17px;color:var(--green);font-weight:700;cursor:pointer}.primary{background:var(--green);border-color:var(--green);color:#fff}.danger{color:#a84370}
.note{text-align:center;color:var(--muted);font-size:12px;margin-top:18px;line-height:1.5}
.empty{text-align:center;background:#fff;padding:35px;border-radius:20px;color:var(--muted)}
@media(max-width:560px){.home{grid-template-columns:1fr}.subject{min-height:170px}.card{height:480px}.q{font-size:21px}.a{font-size:17px}.face{padding:24px}}
</style>
</head>
<body>
<div class="page">
<header><h1>📚 Medical Flashcards</h1><div class="sub">Choose your subject and study one card at a time</div></header>

<section id="home">
  <div class="home">
    <button class="subject" onclick="openSubject('Breast')"><div class="emoji">🎀</div><h2>Breast</h2><div class="count">122 questions</div></button>
    <button class="subject" onclick="openSubject('Thyroid')"><div class="emoji">🦋</div><h2>Thyroid</h2><div class="count">76 questions</div></button>
  </div>
  <div class="global"><button class="star-link" onclick="openStarred()">★ Starred questions <span id="homeStars">(0)</span></button></div>
</section>

<section id="study">
 <div class="top">
   <button class="back" onclick="goHome()">← Subjects</button>
   <div class="title" id="subjectTitle"></div>
   <div class="starcount" id="starCount"></div>
 </div>
 <div class="filters" id="filters"></div>
 <div class="progress"><span id="progressText">0 / 0</span><div class="track"><div class="fill" id="fill"></div></div></div>
 <div class="stage">
   <button class="star" id="starBtn" title="Star for later">★</button>
   <div class="stem" id="stem"></div>
   <div class="card" id="card" onclick="flip()">
     <div class="face front"><div class="kicker" id="qkicker">Question</div><div class="q" id="question"></div><div class="hint">Tap to flip and reveal the answer</div></div>
     <div class="face back"><div class="kicker">Answer</div><div class="a" id="answer"></div><div class="hint">Tap to flip back</div></div>
   </div>
 </div>
 <div class="controls">
   <button class="btn" onclick="prev()">← Previous</button><button class="btn primary" onclick="flip()">Flip</button><button class="btn" onclick="next()">Next →</button><button class="btn" onclick="shuffle()">🔀 Shuffle</button>
 </div>
 <div class="note">Tap ★ to save a question for later. Use “Starred questions” to review all saved cards together.</div>
</section>
</div>
<script>
const DATA = [{"subject": "Breast", "section": "Anatomy, Physiology & Development", "n": 1, "q": "Enumerate the three main structural components of the breast.", "a": "Glandular tissue (lobules, ducts), fibrous tissue (Cooper’s ligaments), and adipose tissue."}, {"subject": "Breast", "section": "Anatomy, Physiology & Development", "n": 2, "q": "Mention the anatomical location and extent of the female breast on the anterior chest wall, including its rib levels and medial/lateral borders.", "a": "Anterior chest wall over pectoralis major, from 2nd–6th ribs, sternum to midaxillary line; axillary tail of Spence extends into the axilla."}, {"subject": "Breast", "section": "Anatomy, Physiology & Development", "n": 3, "q": "Name the major medial and lateral arterial sources that supply the breast.", "a": "Medial: internal mammary artery. Lateral: lateral thoracic artery. Also thoracoacromial and posterior intercostal branches."}, {"subject": "Breast", "section": "Anatomy, Physiology & Development", "n": 4, "q": "List the veins responsible for the venous drainage of the breast.", "a": "Internal thoracic vein, axillary vein, and posterior intercostal veins."}, {"subject": "Breast", "section": "Anatomy, Physiology & Development", "n": 5, "q": "Classify the axillary lymph nodes into their three surgical levels relative to the pectoralis minor muscle.", "a": "Level I: lateral to pectoralis minor. Level II: behind pectoralis minor. Level III: medial to pectoralis minor."}, {"subject": "Breast", "section": "Anatomy, Physiology & Development", "n": 6, "q": "Enumerate the other non-axillary lymph node groups that drain the breast.", "a": "Internal mammary, supraclavicular, and infraclavicular lymph nodes."}, {"subject": "Breast", "section": "Anatomy, Physiology & Development", "n": 7, "q": "Mention the nerves that provide sensory supply to the breast, including their specific spinal segments.", "a": "Intercostal nerves T2–T6; supraclavicular nerves C3–C4; nipple mainly by the lateral cutaneous branch of the 4th intercostal nerve."}, {"subject": "Breast", "section": "Anatomy, Physiology & Development", "n": 8, "q": "Enumerate the key hormones and growth factors that control mammogenesis.", "a": "Estrogen, progesterone, prolactin, and growth factors."}, {"subject": "Breast", "section": "Anatomy, Physiology & Development", "n": 9, "q": "Define polymastia and polythelia.", "a": "Polymastia = accessory breast tissue along the milk line. Polythelia = supernumerary nipples along the milk line."}, {"subject": "Breast", "section": "Anatomy, Physiology & Development", "n": 10, "q": "Name the specific hormones responsible for milk production and milk ejection.", "a": "Milk production → prolactin. Milk ejection → oxytocin."}, {"subject": "Breast", "section": "Clinical Assessment & Diagnostic Techniques", "n": 11, "q": "List the six primary presenting complaints in patients with breast disease and mention the most common causes associated with each.", "a": "Lump, pain/mastalgia, nipple discharge, skin changes, nipple retraction, and axillary swelling."}, {"subject": "Breast", "section": "Clinical Assessment & Diagnostic Techniques", "n": 12, "q": "Enumerate the non-modifiable risk factors for female breast cancer.", "a": "Female sex, age >50, family history/BRCA mutations, previous breast cancer or atypical hyperplasia, early menarche/late menopause, and dense breast tissue."}, {"subject": "Breast", "section": "Clinical Assessment & Diagnostic Techniques", "n": 13, "q": "Enumerate the modifiable risk factors, including hormonal and lifestyle factors, for female breast cancer.", "a": "Nulliparity/late first pregnancy, HRT, oral contraceptives, obesity, alcohol, physical inactivity, and radiation exposure."}, {"subject": "Breast", "section": "Clinical Assessment & Diagnostic Techniques", "n": 14, "q": "Mention the three components of Triple Assessment used to evaluate breast lesions.", "a": "Clinical examination + imaging + pathology."}, {"subject": "Breast", "section": "Clinical Assessment & Diagnostic Techniques", "n": 15, "q": "Enumerate the warning signs (red flags) of breast cancer that require immediate triple assessment.", "a": "Persistent non-cyclic pain, hard fixed mass, spontaneous/bloody unilateral discharge, skin dimpling/acquired nipple retraction, and palpable axillary nodes."}, {"subject": "Breast", "section": "Clinical Assessment & Diagnostic Techniques", "n": 16, "q": "Define the BIRADS scoring system and list its categories from BIRADS 0 to BIRADS 5.", "a": "BIRADS: 0 incomplete, 1 negative, 2 benign, 3 probably benign, 4 suspicious, 5 highly suspicious for malignancy."}, {"subject": "Breast", "section": "Clinical Assessment & Diagnostic Techniques", "n": 17, "q": "List three common biopsy techniques used in breast assessment.", "a": "FNAC, Core Needle Biopsy, and Excisional Biopsy."}, {"subject": "Breast", "section": "Clinical Assessment & Diagnostic Techniques", "n": 18, "q": "Name the hormone and growth factor receptors routinely tested on breast biopsy samples to guide therapy.", "a": "ER, PR, and HER2."}, {"subject": "Breast", "section": "Benign Breast Conditions", "n": 19, "q": "Mention the three reproductive age categories used in the ANDI classification of benign breast disorders.", "a": "Early reproductive 15–25 years; later reproductive 25–40 years; involution 35–55 years."}, {"subject": "Breast", "section": "Benign Breast Conditions", "n": 20, "q": "Define congenital nipple inversion and mention its management.", "a": "Failure of nipple eversion during embryonic development; reassurance or cosmetic surgical correction."}, {"subject": "Breast", "section": "Benign Breast Conditions", "n": 21, "q": "Enumerate the diagnostic findings of Fibrocystic Breast Changes on clinical examination, ultrasound, and mammography.", "a": "Clinical: bilateral diffuse nodularity, worse in luteal phase. US: well-defined anechoic cysts. Mammography: dense glandular pattern."}, {"subject": "Breast", "section": "Benign Breast Conditions", "n": 22, "q": "List the pharmacological options used to treat severe, persistent cyclic mastalgia.", "a": "NSAIDs → EPO/Vitamin E → severe cases: Danazol or Tamoxifen."}, {"subject": "Breast", "section": "Benign Breast Conditions", "n": 23, "q": "Define Mondor’s disease and mention the vein most commonly involved.", "a": "Benign self-limiting superficial thrombophlebitis of breast/chest wall veins, most commonly the lateral thoracic vein."}, {"subject": "Breast", "section": "Benign Breast Conditions", "n": 24, "q": "Mention the clinical characteristics of a typical fibroadenoma (\"breast mouse\").", "a": "Painless, firm, rubbery, highly mobile, smooth, well-circumscribed, usually <3 cm; may be multiple/bilateral and hormone-sensitive."}, {"subject": "Breast", "section": "Benign Breast Conditions", "n": 25, "q": "Enumerate the indications for surgical excision of a fibroadenoma.", "a": "Rapid growth, symptoms, >3 cm, patient preference, or diagnostic uncertainty."}, {"subject": "Breast", "section": "Benign Breast Conditions", "n": 26, "q": "Mention the clinical presentation and diagnosis of an intraductal papilloma.", "a": "Spontaneous unilateral bloody/serous nipple discharge ± subareolar mass/retraction; diagnosis by US, ductography, and biopsy."}, {"subject": "Breast", "section": "Benign Breast Conditions", "n": 27, "q": "Define Sclerosing Adenosis.", "a": "Benign proliferative condition with proliferation of acini and stromal fibrosis that may mimic carcinoma."}, {"subject": "Breast", "section": "Benign Breast Conditions", "n": 28, "q": "Enumerate the clinical and diagnostic features of a breast lipoma.", "a": "Soft, painless, mobile, slow-growing mass; mammography shows well-defined radiolucent mass; US shows homogeneous hypoechoic lesion."}, {"subject": "Breast", "section": "Benign Breast Conditions", "n": 29, "q": "Define breast hamartoma and mention its characteristic sign on mammography.", "a": "Benign mixed tumor of glandular, adipose, and fibrous tissue; mammographic sign = breast-within-a-breast."}, {"subject": "Breast", "section": "Breast Infections & Inflammatory Conditions", "n": 30, "q": "Classify breast infections into acute and chronic types.", "a": "Acute: lactational mastitis, non-lactational mastitis, breast abscess. Chronic: tuberculosis, fungal mastitis, granulomatous mastitis."}, {"subject": "Breast", "section": "Breast Infections & Inflammatory Conditions", "n": 31, "q": "Name the most common causative pathogen of lactational mastitis.", "a": "Staphylococcus aureus."}, {"subject": "Breast", "section": "Breast Infections & Inflammatory Conditions", "n": 32, "q": "List the first-line and MRSA-directed oral antibiotics used to treat lactational mastitis.", "a": "No MRSA risk → Dicloxacillin or Cephalexin. MRSA risk → Clindamycin or TMP-SMX."}, {"subject": "Breast", "section": "Breast Infections & Inflammatory Conditions", "n": 33, "q": "Enumerate the risk factors associated with non-lactational (periductal) mastitis.", "a": "Smoking, nipple piercing, and nipple inversion."}, {"subject": "Breast", "section": "Breast Infections & Inflammatory Conditions", "n": 34, "q": "Mention the diagnostic findings and treatment options for a breast abscess.", "a": "Tender fluctuant mass with erythema/warmth/fever; ultrasound confirms. Treatment: aspiration or I&D + antibiotics."}, {"subject": "Breast", "section": "Breast Infections & Inflammatory Conditions", "n": 35, "q": "Enumerate the risk factors and diagnostic modalities for Tuberculous Mastitis.", "a": "Risk factors: previous pulmonary TB, immunosuppression, severe malnutrition. Diagnosis: FNAC/biopsy, ZN stain, GeneXpert."}, {"subject": "Breast", "section": "Breast Infections & Inflammatory Conditions", "n": 36, "q": "Mention the etiology, clinical features, and management of Fungal Mastitis.", "a": "Usually Candida albicans; burning pain, erythematous shiny nipple with cracks. Diagnosis by KOH; topical antifungals or oral fluconazole if severe."}, {"subject": "Breast", "section": "Breast Infections & Inflammatory Conditions", "n": 37, "q": "Define Granulomatous Mastitis and mention its histologic findings.", "a": "Chronic inflammatory breast disease; histology shows non-caseating granulomas."}, {"subject": "Breast", "section": "Breast Cancer & Male Breast Diseases", "n": 38, "q": "Classify the histological types of breast cancer, highlighting the most common invasive type.", "a": "DCIS, LCIS, IDC (most common invasive type), ILC, and rare types such as Paget, medullary, mucinous, and inflammatory."}, {"subject": "Breast", "section": "Breast Cancer & Male Breast Diseases", "n": 39, "q": "Name the four molecular subtypes of breast cancer based on receptor status.", "a": "Luminal A → ER+/PR+, HER2−, best prognosis. Luminal B → ER+/PR+, HER2+, more aggressive. HER2-enriched → ER−/PR−/HER2+. Triple negative → ER−/PR−/HER2−, worst prognosis."}, {"subject": "Breast", "section": "Breast Cancer & Male Breast Diseases", "n": 40, "q": "Enumerate the clinical signs of advanced breast cancer.", "a": "Fixed mass, skin ulceration/fungation, hard fixed axillary/supraclavicular nodes, arm lymphedema, and metastatic symptoms."}, {"subject": "Breast", "section": "Breast Cancer & Male Breast Diseases", "n": 41, "q": "State the TNM staging criteria for breast cancer (T1-T4, N0-N2, M0-M1).", "a": "T1 <2 cm; T2 2–5 cm; T3 >5 cm; T4 any size with chest wall/skin extension. N0 no nodes; N1 movable ipsilateral axillary nodes; N2 fixed/matted ipsilateral axillary nodes. M0 no distant metastasis; M1 distant metastasis."}, {"subject": "Breast", "section": "Breast Cancer & Male Breast Diseases", "n": 42, "q": "List the systemic therapy options available for breast cancer treatment.", "a": "Hormonal therapy, chemotherapy, HER2-targeted therapy, and immunotherapy."}, {"subject": "Breast", "section": "Breast Cancer & Male Breast Diseases", "n": 43, "q": "Mention the breast cancer screening guidelines for average-risk and high-risk women.", "a": "Average risk → mammography every 1–2 years from age 40. High risk → MRI, usually beginning earlier."}, {"subject": "Breast", "section": "Breast Cancer & Male Breast Diseases", "n": 44, "q": "Enumerate the 5-year survival rates of breast cancer by stage (Stages I-IV).", "a": "Stage I >90%; Stage II 75–85%; Stage III 50–70%; Stage IV <25%."}, {"subject": "Breast", "section": "Breast Cancer & Male Breast Diseases", "n": 45, "q": "List the physiological and pathological causes of gynecomastia in males.", "a": "Physiological: neonatal, pubertal, elderly. Pathological: hormonal disorders, liver disease, CKD, tumors, and drugs."}, {"subject": "Breast", "section": "Breast Cancer & Male Breast Diseases", "n": 46, "q": "List five classes or examples of drugs known to cause gynecomastia.", "a": "Anti-androgens, aldosterone antagonists, anabolic steroids, exogenous estrogens, and psychotropic drugs."}, {"subject": "Breast", "section": "Breast Cancer & Male Breast Diseases", "n": 47, "q": "Enumerate the risk factors for male breast cancer.", "a": "BRCA2/BRCA1, TP53, Klinefelter syndrome, high-estrogen states, radiation, and family history."}, {"subject": "Breast", "section": "Level 2 – Moderate", "n": 48, "q": "Explain the clinical significance of the retromammary space in breast surgery.", "a": "Retromammary space separates breast from pectoralis major and provides a relatively bloodless plane useful in mastectomy and implant surgery."}, {"subject": "Breast", "section": "Level 2 – Moderate", "n": 49, "q": "Give reasons why breast cancer can cause skin dimpling or retraction.", "a": "Cancer invades Cooper’s ligaments → fibrosis and shortening → pulls skin inward → skin dimpling/retraction."}, {"subject": "Breast", "section": "Level 2 – Moderate", "n": 50, "q": "Explain the anatomical route by which breast cancer metastasizes to the spine.", "a": "Posterior breast → posterior intercostal veins → Batson’s vertebral venous plexus → vertebral metastasis."}, {"subject": "Breast", "section": "Level 2 – Moderate", "n": 51, "q": "Explain why axillary lymph node dissection can lead to lymphedema, and outline how it can be prevented.", "a": "ALND disrupts lymphatic drainage → lymph accumulation → lymphedema. Prevention: SLNB when appropriate."}, {"subject": "Breast", "section": "Level 2 – Moderate", "n": 52, "q": "Explain why breast cancer is more common in postmenopausal women with a history of early menarche and late menopause.", "a": "Early menarche + late menopause → prolonged estrogen exposure → increased epithelial proliferation and mutation risk."}, {"subject": "Breast", "section": "Level 2 – Moderate", "n": 53, "q": "Outline the physiological breast changes that occur during pregnancy and lactation, specifying the hormonal influences.", "a": "Pregnancy: estrogen → ducts; progesterone + prolactin → lobuloalveolar development. Lactation: prolactin → milk production; oxytocin → milk ejection."}, {"subject": "Breast", "section": "Level 2 – Moderate", "n": 54, "q": "Explain the physiological changes the breast undergoes during menopause.", "a": "↓ Estrogen → glandular atrophy, ↓ fibrous tissue, ↑ fat → softer, less radiodense breast."}, {"subject": "Breast", "section": "Level 2 – Moderate", "n": 55, "q": "Explain why a history of previous breast biopsy results or radiation therapy is critical in assessing breast cancer risk.", "a": "Previous atypical hyperplasia increases cancer risk; previous chest radiation can cause DNA damage and later breast malignancy."}, {"subject": "Breast", "section": "Level 2 – Moderate", "n": 56, "q": "Differentiate between cyclic and non-cyclic mastalgia in terms of onset, characteristics, and common etiologies.", "a": "Cyclic: bilateral, diffuse, luteal phase, heaviness/soreness, hormonal/fibrocystic causes. Non-cyclic: unilateral, localized, sharp/burning, unrelated to cycle; trauma, surgery, infection, cysts, duct ectasia."}, {"subject": "Breast", "section": "Level 2 – Moderate", "n": 57, "q": "Differentiate between FNAC and CNB in terms of clinical indications, advantages, and limitations.", "a": "FNAC: quick, minimally invasive, cells only, cannot assess architecture or reliably distinguish DCIS from invasive cancer. CNB: gold-standard tissue diagnosis, preserves architecture, allows ER/PR/HER2 testing."}, {"subject": "Breast", "section": "Level 2 – Moderate", "n": 58, "q": "Compare the indications, advantages, and target age groups for Mammography versus Ultrasound in breast imaging.", "a": "Mammography → generally ≥40 years; screening and microcalcifications. Ultrasound → younger/dense breasts; palpable masses, cystic vs solid, biopsy guidance."}, {"subject": "Breast", "section": "Level 2 – Moderate", "n": 59, "q": "Differentiate between congenital and acquired nipple inversion, explaining their respective clinical implications.", "a": "Congenital → longstanding, benign, reassurance/cosmetic correction. Acquired → duct shortening/tumor infiltration; red flag requiring triple assessment."}, {"subject": "Breast", "section": "Level 2 – Moderate", "n": 60, "q": "Explain the management algorithm for simple versus complex breast cysts detected on ultrasound.", "a": "Simple cyst → no treatment unless symptomatic; aspirate if painful. Clear fluid + complete resolution → reassure. Complex cyst → core biopsy/FNA as appropriate to exclude malignancy."}, {"subject": "Breast", "section": "Level 2 – Moderate", "n": 61, "q": "Outline the pathophysiology, clinical presentation, and management of Duct Ectasia.", "a": "Duct widening/thickening → lipid accumulation → inflammation → fibrosis. Causes green/brown sticky discharge, subareolar thickening, nipple retraction and non-cyclic pain. Management: reassurance/warm compresses ± antibiotics; duct excision if persistent."}, {"subject": "Breast", "section": "Level 2 – Moderate", "n": 62, "q": "Explain how Sclerosing Adenosis can clinically and radiologically mimic breast carcinoma.", "a": "Can produce firm fixed mass and mammographic distortion/microcalcifications mimicking carcinoma; core biopsy confirms diagnosis."}, {"subject": "Breast", "section": "Level 2 – Moderate", "n": 63, "q": "Compare Fibroadenoma and Phyllodes Tumor (Benign Variant) in terms of peak age of onset, clinical behavior, and surgical management.", "a": "Fibroadenoma: 15–35, slow-growing, benign, observation or enucleation. Phyllodes: 40–50, rapid/large growth, recurrence risk, requires wide excision with ≥1 cm margin."}, {"subject": "Breast", "section": "Level 2 – Moderate", "n": 64, "q": "Explain the clinical presentation, diagnosis, and management of a Lactating Adenoma.", "a": "Lactating adenoma = soft, painless, mobile mass during pregnancy/lactation. US shows well-defined homogeneous mass. Usually conservative; most regress postpartum."}, {"subject": "Breast", "section": "Level 2 – Moderate", "n": 65, "q": "Outline the pathophysiology of lactational mastitis, and explain why frequent breastfeeding is emphasized in its management.", "a": "Milk stasis → bacterial entry through nipple cracks, commonly S. aureus → inflammation/infection. Frequent breastfeeding empties breast, removes milk stasis and prevents abscess."}, {"subject": "Breast", "section": "Level 2 – Moderate", "n": 66, "q": "Compare lactational mastitis and non-lactational mastitis in terms of etiology, risk factors, and first-line antibiotic choices.", "a": "Lactational: milk stasis + S. aureus; poor latch/cracked nipples; Dicloxacillin/Cephalexin. Non-lactational: duct ectasia/squamous metaplasia; smoking/piercing/inversion; Amoxicillin-Clavulanate or Clindamycin."}, {"subject": "Breast", "section": "Level 2 – Moderate", "n": 67, "q": "Explain how fat necrosis of the breast occurs, and give reasons why it often mimics breast carcinoma.", "a": "Trauma/surgery → fat necrosis → lipid release → inflammation → fibrosis/calcification. Mimics cancer as a firm irregular fixed mass with suspicious imaging; biopsy distinguishes it."}, {"subject": "Breast", "section": "Level 2 – Moderate", "n": 68, "q": "Explain the diagnostic approach and management of Granulomatous Mastitis.", "a": "Triple assessment + core biopsy showing non-caseating granulomas; exclude TB, sarcoidosis and malignancy. Treatment mainly corticosteroids/immunosuppression; surgery for refractory cases."}, {"subject": "Breast", "section": "Level 2 – Moderate", "n": 69, "q": "Compare DCIS and LCIS regarding anatomical origin, clinical behavior, and risk implication.", "a": "DCIS → duct epithelium, direct precursor of invasive ductal carcinoma, often microcalcifications. LCIS → terminal lobules, usually incidental, marker of bilateral future breast cancer risk."}, {"subject": "Breast", "section": "Level 2 – Moderate", "n": 70, "q": "Differentiate Paget’s disease of the breast from mammary eczema.", "a": "Paget: unilateral, starts at nipple, scaling/ulceration, does not respond to steroids, associated with underlying carcinoma. Eczema: usually bilateral, mainly areola, pruritic, responds to steroids."}, {"subject": "Breast", "section": "Level 2 – Moderate", "n": 71, "q": "Explain the pathophysiology behind the \"peau d’orange\" skin change seen in inflammatory breast cancer.", "a": "Tumor emboli obstruct dermal lymphatics → lymphatic stasis/edema → skin becomes pitted around tethered hair follicles → peau d’orange."}, {"subject": "Breast", "section": "Level 2 – Moderate", "n": 72, "q": "Compare the four molecular subtypes of breast cancer in terms of receptor status, prognosis, and treatment options.", "a": "Luminal A → ER/PR+, HER2− → best → hormonal therapy. Luminal B → ER/PR+, HER2+ → more aggressive → hormonal + chemotherapy + anti-HER2. HER2-enriched → ER/PR−, HER2+ → chemotherapy + anti-HER2. Triple negative → ER/PR/HER2− → chemotherapy/immunotherapy."}, {"subject": "Breast", "section": "Level 2 – Moderate", "n": 73, "q": "Explain the clinical concept of Sentinel Lymph Node Biopsy (SLNB), its indications and advantages over axillary dissection.", "a": "SLNB identifies the first draining lymph node using blue dye/radioactive colloid. Used mainly in clinically N0 disease. If negative, ALND can be avoided, reducing lymphedema, pain and sensory loss."}, {"subject": "Breast", "section": "Level 2 – Moderate", "n": 74, "q": "Compare the indications for Breast-Conserving Surgery (lumpectomy) versus Mastectomy.", "a": "Lumpectomy + radiation → small localized single-focus tumor with achievable clear margins. Mastectomy → large tumor, multifocal/multicentric disease, radiation contraindication, patient preference or high-risk mutations."}, {"subject": "Breast", "section": "Level 2 – Moderate", "n": 75, "q": "Outline the mechanism of action, indications, and patient selection for Tamoxifen versus Aromatase Inhibitors.", "a": "Tamoxifen = SERM, blocks estrogen action in breast; mainly premenopausal ER/PR+ women. Aromatase inhibitors = block peripheral estrogen production; mainly postmenopausal ER/PR+ women."}, {"subject": "Breast", "section": "Level 2 – Moderate", "n": 76, "q": "Compare male and female breast anatomy, and explain why male breast cancer typically presents with early involvement of skin and chest wall.", "a": "Male breast has very little glandular tissue and lacks functional lobules/acini. Minimal tissue/fat means tumors quickly reach skin and pectoralis major → early skin/chest-wall involvement."}, {"subject": "Breast", "section": "Level 2 – Moderate", "n": 77, "q": "Explain the endocrine pathophysiology of Gynecomastia.", "a": "Gynecomastia results from increased estrogen-to-androgen ratio. Estrogen stimulates ductal/stromal proliferation; androgens inhibit it."}, {"subject": "Breast", "section": "Level 2 – Moderate", "n": 78, "q": "Differentiate physiological from pathological gynecomastia and outline management.", "a": "Physiological → neonatal/puberty/old age, usually bilateral and self-limiting → reassurance. Pathological → disease/drugs/endocrine tumors → treat cause, stop offending drug ± Tamoxifen/surgery for persistent cases."}, {"subject": "Breast", "section": "Level 2 – Moderate", "n": 79, "q": "Differentiate gynecomastia from male breast cancer based on clinical findings and triple assessment.", "a": "Gynecomastia → soft/rubbery, concentric subareolar tissue, mobile, often bilateral, no skin ulceration/hard nodes. Cancer → unilateral, hard, irregular, fixed mass, nipple retraction/bloody discharge/hard axillary nodes; suspicious imaging + CNB."}, {"subject": "Breast", "section": "Case 1 – Inflammatory Breast Cancer vs. Mastitis", "n": 80, "q": "What is the most likely diagnosis?", "a": "Inflammatory Breast Cancer (IBC).", "stem": "A postmenopausal woman presents with rapid onset of breast redness, warmth, skin thickening and peau d’orange appearance, associated with axillary lymphadenopathy. There is no fever or other evidence of infection."}, {"subject": "Breast", "section": "Case 1 – Inflammatory Breast Cancer vs. Mastitis", "n": 81, "q": "What is the anatomical cause of the \"orange peel\" appearance (peau d’orange)?", "a": "Tumor blocks dermal lymphatics → lymphatic stasis + edema → peau d’orange.", "stem": "A postmenopausal woman presents with rapid onset of breast redness, warmth, skin thickening and peau d’orange appearance, associated with axillary lymphadenopathy. There is no fever or other evidence of infection."}, {"subject": "Breast", "section": "Case 1 – Inflammatory Breast Cancer vs. Mastitis", "n": 82, "q": "Outline the stepwise diagnostic approach to confirm this diagnosis and explain why standard antibiotics are inappropriate here.", "a": "Clinical examination → urgent US + bilateral diagnostic mammography → core biopsy ± skin punch biopsy. Antibiotics are inappropriate because the inflammation is caused by tumor emboli, not bacterial infection.", "stem": "A postmenopausal woman presents with rapid onset of breast redness, warmth, skin thickening and peau d’orange appearance, associated with axillary lymphadenopathy. There is no fever or other evidence of infection."}, {"subject": "Breast", "section": "Case 2 – Lactational Mastitis vs. Breast Abscess", "n": 83, "q": "What is the most likely diagnosis, and what is the typical pathogen?", "a": "Lactational mastitis; most common pathogen = Staphylococcus aureus.", "stem": "A lactating woman presents with a painful, red, swollen breast with features suggestive of mastitis."}, {"subject": "Breast", "section": "Case 2 – Lactational Mastitis vs. Breast Abscess", "n": 84, "q": "How would you manage this patient, and what specific advice should you give her regarding breastfeeding?", "a": "Dicloxacillin/Cephalexin + supportive care; continue frequent breastfeeding/pumping to empty the breast.", "stem": "A lactating woman presents with a painful, red, swollen breast with features suggestive of mastitis."}, {"subject": "Breast", "section": "Case 2 – Lactational Mastitis vs. Breast Abscess", "n": 85, "q": "If the patient returns 3 days later with a tender, fluctuant mass in the same quadrant despite oral dicloxacillin, what is the next diagnostic step, and how does the management change?", "a": "Breast ultrasound → confirms abscess → US-guided aspiration preferred or I&D; send pus for culture; use Clindamycin/TMP-SMX if MRSA suspected.", "stem": "A lactating woman presents with a painful, red, swollen breast with features suggestive of mastitis."}, {"subject": "Breast", "section": "Case 3 – Fibroadenoma vs. Phyllodes Tumor", "n": 86, "q": "What are the top two differential diagnoses for this rapidly growing mass?", "a": "Giant/juvenile fibroadenoma and phyllodes tumor.", "stem": "A young woman presents with a rapidly growing breast mass."}, {"subject": "Breast", "section": "Case 3 – Fibroadenoma vs. Phyllodes Tumor", "n": 87, "q": "Explain why fine-needle aspiration (FNA) is insufficient in this scenario, and state the preferred diagnostic modality to differentiate these two conditions.", "a": "FNA cannot assess stromal architecture; CNB is preferred.", "stem": "A young woman presents with a rapidly growing breast mass."}, {"subject": "Breast", "section": "Case 3 – Fibroadenoma vs. Phyllodes Tumor", "n": 88, "q": "If the pathology report confirms a benign variant of a fibroepithelial neoplasm, what is the definitive surgical management and why?", "a": "Wide local excision with ≥1 cm clear margins because phyllodes has significant local recurrence risk.", "stem": "A young woman presents with a rapidly growing breast mass."}, {"subject": "Breast", "section": "Case 4 – Paget’s Disease of the Breast", "n": 89, "q": "What is the most likely diagnosis?", "a": "Paget’s disease of the breast.", "stem": "A postmenopausal woman presents with unilateral progressive scaling and red/weeping changes of the nipple that have not responded to topical steroids."}, {"subject": "Breast", "section": "Case 4 – Paget’s Disease of the Breast", "n": 90, "q": "Explain how this condition is differentiated clinically from mammary eczema.", "a": "Paget = unilateral, starts at nipple, steroid-resistant. Eczema = usually bilateral, mainly areola, steroid-responsive.", "stem": "A postmenopausal woman presents with unilateral progressive scaling and red/weeping changes of the nipple that have not responded to topical steroids."}, {"subject": "Breast", "section": "Case 4 – Paget’s Disease of the Breast", "n": 91, "q": "What is the clinical significance of this finding, and what diagnostic investigations must be performed as part of her workup?", "a": "Indicates underlying malignancy; perform bilateral diagnostic mammography, US, and nipple scrape/punch biopsy.", "stem": "A postmenopausal woman presents with unilateral progressive scaling and red/weeping changes of the nipple that have not responded to topical steroids."}, {"subject": "Breast", "section": "Case 5 – Breast Cysts and FNA", "n": 92, "q": "Interpret the ultrasound findings.", "a": "Thin-walled, well-circumscribed, anechoic lesion with posterior enhancement = simple breast cyst.", "stem": "A woman presents with a breast lump. Ultrasound demonstrates a thin-walled, well-circumscribed, anechoic fluid-filled lesion with posterior acoustic enhancement."}, {"subject": "Breast", "section": "Case 5 – Breast Cysts and FNA", "n": 93, "q": "Outline the clinical management algorithm based on the potential findings of the aspirate, e.g. if the fluid is clear versus bloody, and if the mass completely resolves versus persists.", "a": "FNA → clear/straw-colored fluid + complete disappearance = reassure. Bloody fluid or persistent/recurrent mass → cytology + core biopsy of residual solid component.", "stem": "A woman presents with a breast lump. Ultrasound demonstrates a thin-walled, well-circumscribed, anechoic fluid-filled lesion with posterior acoustic enhancement."}, {"subject": "Breast", "section": "Case 6 – Mondor’s Disease", "n": 94, "q": "What is the most likely diagnosis?", "a": "Mondor’s disease.", "stem": "A woman develops a painful, firm, cord-like subcutaneous structure over the breast/chest wall following mechanical trauma or strenuous physical activity."}, {"subject": "Breast", "section": "Case 6 – Mondor’s Disease", "n": 95, "q": "Identify the most likely affected blood vessel and explain the pathophysiology of this condition.", "a": "Lateral thoracic vein; trauma/exercise/surgery/tight clothing → venous injury/stasis → superficial thrombosis → painful cord-like lesion.", "stem": "A woman develops a painful, firm, cord-like subcutaneous structure over the breast/chest wall following mechanical trauma or strenuous physical activity."}, {"subject": "Breast", "section": "Case 6 – Mondor’s Disease", "n": 96, "q": "Outline the management and expected prognosis of this patient.", "a": "Reassurance + NSAIDs + warm compresses. Excellent prognosis; resolves in about 4–8 weeks.", "stem": "A woman develops a painful, firm, cord-like subcutaneous structure over the breast/chest wall following mechanical trauma or strenuous physical activity."}, {"subject": "Breast", "section": "Case 7 – Duct Ectasia vs. Intraductal Papilloma", "n": 97, "q": "What is the most likely diagnosis?", "a": "Duct ectasia.", "stem": "A perimenopausal woman presents with dark green nipple discharge, subareolar thickening and nipple retraction."}, {"subject": "Breast", "section": "Case 7 – Duct Ectasia vs. Intraductal Papilloma", "n": 98, "q": "What is the main clinical differential diagnosis for spontaneous nipple discharge, and how does its characteristic discharge differ?", "a": "Main differential = intraductal papilloma. Papilloma → spontaneous unilateral bloody/serous discharge; duct ectasia → thick sticky dark green/brown discharge.", "stem": "A perimenopausal woman presents with dark green nipple discharge, subareolar thickening and nipple retraction."}, {"subject": "Breast", "section": "Case 7 – Duct Ectasia vs. Intraductal Papilloma", "n": 99, "q": "Outline the diagnostic steps and explain the indications for surgical intervention in this patient.", "a": "Clinical examination → mammography + US → discharge cytology. Persistent/distressing discharge or suspicious findings → duct excision.", "stem": "A perimenopausal woman presents with dark green nipple discharge, subareolar thickening and nipple retraction."}, {"subject": "Breast", "section": "Case 8 – Breast Cancer Risk and Hormonal Exposure", "n": 100, "q": "Analyze this patient’s non-modifiable and modifiable risk factors based on her history.", "a": "Non-modifiable: female sex, early menarche, first-degree family history. Modifiable/hormonal: nulliparity and planned hormone therapy.", "stem": "A woman has early menarche at age 10, has never been pregnant, and has a mother who was diagnosed with breast cancer at age 45. She is considering hormone therapy."}, {"subject": "Breast", "section": "Case 8 – Breast Cancer Risk and Hormonal Exposure", "n": 101, "q": "Explain the biochemical rationale linking early menarche and nulliparity to increased breast cancer risk.", "a": "More menstrual cycles → prolonged estrogen/progesterone exposure → increased epithelial proliferation and DNA replication errors; nulliparity lacks the protective maturation of pregnancy.", "stem": "A woman has early menarche at age 10, has never been pregnant, and has a mother who was diagnosed with breast cancer at age 45. She is considering hormone therapy."}, {"subject": "Breast", "section": "Case 8 – Breast Cancer Risk and Hormonal Exposure", "n": 102, "q": "What screening modifications or genetic testing options would you recommend for this patient?", "a": "Earlier mammography, annual MRI, genetic counseling and BRCA1/BRCA2 testing.", "stem": "A woman has early menarche at age 10, has never been pregnant, and has a mother who was diagnosed with breast cancer at age 45. She is considering hormone therapy."}, {"subject": "Breast", "section": "Case 9 – Molecular Subtypes and Adjuvant Therapy Selection", "n": 103, "q": "Classify the tumor’s molecular subtype and state its clinical prognosis relative to other subtypes.", "a": "Luminal A: ER+, PR+, HER2−; best prognosis.", "stem": "A 55-year-old postmenopausal woman has an early-stage, node-negative breast tumor that is ER-positive, PR-positive and HER2-negative. She underwent breast-conserving surgery."}, {"subject": "Breast", "section": "Case 9 – Molecular Subtypes and Adjuvant Therapy Selection", "n": 104, "q": "What adjuvant therapies are indicated for this patient, and explain why an aromatase inhibitor is preferred over tamoxifen in this scenario?", "a": "Radiation after lumpectomy + endocrine therapy. Aromatase inhibitor preferred because patient is postmenopausal and peripheral aromatization is the main estrogen source.", "stem": "A 55-year-old postmenopausal woman has an early-stage, node-negative breast tumor that is ER-positive, PR-positive and HER2-negative. She underwent breast-conserving surgery."}, {"subject": "Breast", "section": "Case 9 – Molecular Subtypes and Adjuvant Therapy Selection", "n": 105, "q": "What tumor marker should be monitored during her follow-up?", "a": "CA 15-3.", "stem": "A 55-year-old postmenopausal woman has an early-stage, node-negative breast tumor that is ER-positive, PR-positive and HER2-negative. She underwent breast-conserving surgery."}, {"subject": "Breast", "section": "Case 10 – Gynecomastia and Drug-Induced Side Effects", "n": 106, "q": "What is the clinical term for this condition, and how does the pathophysiology differ from a simple lipoma?", "a": "Gynecomastia; benign proliferation of ductal/stromal tissue due to increased estrogen-to-androgen ratio, unlike lipoma which is mature adipose tissue.", "stem": "A male patient develops bilateral breast enlargement while taking spironolactone and finasteride."}, {"subject": "Breast", "section": "Case 10 – Gynecomastia and Drug-Induced Side Effects", "n": 107, "q": "Identify the dual pharmacological causes in this patient’s history and explain their mechanisms of action.", "a": "Spironolactone → anti-androgenic effects/increases estrogenic balance. Finasteride → inhibits testosterone → DHT conversion, reducing androgenic effect.", "stem": "A male patient develops bilateral breast enlargement while taking spironolactone and finasteride."}, {"subject": "Breast", "section": "Case 10 – Gynecomastia and Drug-Induced Side Effects", "n": 108, "q": "Explain how you would differentiate this condition from male breast cancer clinically, and outline the initial management plan.", "a": "Gynecomastia = symmetrical/bilateral, soft/rubbery, mobile subareolar tissue. Cancer = unilateral, hard, irregular, fixed mass ± retraction/bloody discharge/nodes. Management → reassurance, discontinue/substitute offending drugs, monitor.", "stem": "A male patient develops bilateral breast enlargement while taking spironolactone and finasteride."}, {"subject": "Breast", "section": "Case 11 – Male Breast Cancer", "n": 109, "q": "What is the primary diagnosis?", "a": "Male breast cancer with axillary lymph node metastasis, T2 N1 M0.", "stem": "A male patient presents with a 2-cm hard subareolar breast mass and regional axillary lymph node enlargement. He also has liver cirrhosis."}, {"subject": "Breast", "section": "Case 11 – Male Breast Cancer", "n": 110, "q": "Explain how liver cirrhosis contributes to the pathogenesis and risk of this disease in males.", "a": "Cirrhosis ↓ estrogen clearance + increases peripheral aromatization → hyperestrogenism → stimulation of ductal epithelium → increased cancer risk.", "stem": "A male patient presents with a 2-cm hard subareolar breast mass and regional axillary lymph node enlargement. He also has liver cirrhosis."}, {"subject": "Breast", "section": "Case 11 – Male Breast Cancer", "n": 111, "q": "Outline the \"triple assessment\" process for this patient, and explain why the surgical mainstay of treatment differs from that of a female with a similar-sized tumor.", "a": "Triple assessment = clinical examination + mammography/US + core biopsy ± axillary FNA. In males, breast tissue is minimal, so a 2-cm tumor is close to nipple and pectoral fascia; therefore Modified Radical Mastectomy is the surgical mainstay.", "stem": "A male patient presents with a 2-cm hard subareolar breast mass and regional axillary lymph node enlargement. He also has liver cirrhosis."}, {"subject": "Breast", "section": "Additional Questions", "n": 112, "q": "What are the causes of mastitis or breast abscess in males?", "a": "Infectious mastitis in immunocompromised persons, trauma-related, secondary bacterial infection, and ductal ectasia (periductal mastitis)."}, {"subject": "Breast", "section": "Additional Questions", "n": 113, "q": "Why does breast cancer have a higher incidence in developed countries?", "a": "Due to longer life expectancy, hormonal use, and lifestyle factors."}, {"subject": "Breast", "section": "Additional Questions", "n": 114, "q": "Define Cooper’s ligament and the retromammary space.", "a": "Cooper’s ligament: a fibrous band that provides structural support and maintains breast shape. Retromammary space: loose connective tissue that separates the breast from pectoralis major."}, {"subject": "Breast", "section": "Additional Questions", "n": 115, "q": "Define sentinel lymph node.", "a": "It is the first node to receive drainage from a breast tumor."}, {"subject": "Breast", "section": "Additional Questions", "n": 116, "q": "What are the non-proliferative benign breast conditions?", "a": "Fibrocystic breast disease, breast cyst, duct ectasia, and Mondor’s disease."}, {"subject": "Breast", "section": "Additional Questions", "n": 117, "q": "What are the proliferative and inflammatory breast diseases?", "a": "Proliferative: fibroadenoma and intraductal papilloma. Inflammatory: mastitis and abscess, fat necrosis."}, {"subject": "Breast", "section": "Additional Questions", "n": 118, "q": "What laboratory tests are used in mastitis?", "a": "Hormonal profile and infection markers."}, {"subject": "Breast", "section": "Additional Questions", "n": 119, "q": "What is the management of a premalignant lesion like atypical hyperplasia?", "a": "Close surveillance, chemoprevention with tamoxifen, and surgical excision."}, {"subject": "Breast", "section": "Additional Questions", "n": 120, "q": "What are the symptoms of breast cancer?", "a": "Painless, hard, irregular, non-mobile breast lump; skin changes (dimpling or ulceration); nipple changes (retraction and discharge); axillary lump; metastatic symptoms."}, {"subject": "Breast", "section": "Additional Questions", "n": 121, "q": "What is Troisier’s sign?", "a": "It is when the axillary, intramammary, and supraclavicular nodes show infiltration."}, {"subject": "Breast", "section": "Additional Questions", "n": 122, "q": "What is the difference between skin puckering and tethering?", "a": "Skin puckering is the visible, outward sign of an indentation or wrinkling on the skin surface. Tethering is the internal process causing it — where deep tissue, a scar, or a mass attaches to and pulls on the overlying skin."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 1, "q": "What is the embryological origin of the thyroid?", "a": "Floor of primitive pharynx → 4th week → foramen cecum → thyroglossal duct → pretracheal position."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 2, "q": "What results from failure of thyroglossal duct regression, and how is it treated?", "a": "Thyroglossal duct cyst → Sistrunk operation."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 3, "q": "What is ectopic thyroid tissue, and what is its commonest site?", "a": "Ectopic thyroid tissue → lingual thyroid."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 4, "q": "What are the three main arteries supplying the thyroid?", "a": "Superior thyroid artery → external carotid.\nInferior thyroid artery → thyrocervical trunk.\nThyroid ima → aorta/brachiocephalic trunk."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 5, "q": "Where do the thyroid veins drain?", "a": "Superior & middle thyroid veins → internal jugular veins.\nInferior thyroid veins → brachiocephalic veins."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 6, "q": "Which neck lymph-node levels are involved in thyroid cancer spread?", "a": "Central compartment → Level VI.\nLateral compartment → Levels II, III, IV, V."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 7, "q": "Which cells produce T3/T4 and calcitonin?", "a": "T3 & T4 → follicular cells.\nCalcitonin → parafollicular C cells."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 8, "q": "What are the steps of thyroid hormone synthesis?", "a": "Iodide uptake → organification → coupling → endocytosis → proteolysis → release."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 9, "q": "How much circulating thyroid hormone is bound vs free, and what is the main carrier?", "a": "99% is protein-bound; <1% is free. Main carrier → TBG."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 10, "q": "What is the HPT-axis feedback mechanism?", "a": "TRH → TSH → T3/T4 → negative feedback."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 11, "q": "How does hyperthyroidism differ clinically from hypothyroidism?", "a": "Hyper: weight loss, heat intolerance, tachycardia, tremor, diarrhea, sweating, anxiety/insomnia.\nHypo: weight gain, cold intolerance, bradycardia, slow reflexes, constipation, dry skin, lethargy/depression."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 12, "q": "What is Pemberton's sign and what does it indicate?", "a": "Facial congestion/cyanosis or respiratory distress on raising the arms → suggests retrosternal goitre."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 13, "q": "What neck findings are suspicious for malignant thyroid disease?", "a": "Hard/fixed nodule, cervical lymphadenopathy, hoarseness, dysphagia, dyspnea, or local invasion."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 14, "q": "What are the TFT patterns in primary hyperthyroidism, primary hypothyroidism, and secondary hypothyroidism?", "a": "Primary hyper: ↓TSH, ↑FT4, ↑FT3.\nPrimary hypo: ↑TSH, ↓FT4, ↓/normal FT3.\nSecondary hypo: ↓/inappropriately normal TSH, ↓FT4/FT3."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 15, "q": "Which antibodies are associated with Hashimoto's and Graves' disease?", "a": "Hashimoto → Anti-TPO, Anti-TG.\nGraves → TRAb/TSI."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 16, "q": "How can goitres be classified?", "a": "Functional: euthyroid, toxic, hypothyroid.\nMorphological: diffuse, solitary nodular, multinodular.\nEtiological: physiological, endemic, sporadic."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 17, "q": "What are major causes of goitre?", "a": "Iodine deficiency, autoimmune disease, benign nodules, malignancy, thyroiditis, drugs, congenital dyshormonogenesis."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 18, "q": "What pressure symptoms can a massive multinodular/retrosternal goitre cause?", "a": "Dysphagia, dyspnea, stridor, hoarseness, neck/chest fullness."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 19, "q": "What are absolute indications for thyroidectomy in goitre?", "a": "Compression, malignancy/suspicion, refractory toxic goitre, retrosternal extension, significant cosmetic problem."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 20, "q": "What is nontoxic nodular goitre and what are its risk factors?", "a": "Nodular enlargement without hyper/hypothyroidism. Risk factors: iodine deficiency, genetics, female sex, age, goitrogens, lithium, chronic TSH stimulation."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 21, "q": "What is a solitary thyroid nodule and its malignancy rate?", "a": "A solitary thyroid nodule is a single thyroid nodule; malignancy occurs in about 5–15%."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 22, "q": "How are solitary thyroid nodules classified histologically?", "a": "Benign: colloid nodule, adenoma, cyst, thyroiditis-related nodule.\nMalignant: papillary, follicular, medullary, anaplastic, lymphoma, metastasis."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 23, "q": "What features increase suspicion of malignancy in a solitary thyroid nodule?", "a": "Male sex; age <20 or >60; radiation exposure; family history/MEN2; rapid growth; hard/fixed nodule; hoarseness; dysphagia; dyspnea; lymphadenopathy; cold nodule; suspicious ultrasound."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 24, "q": "What are the six Bethesda categories?", "a": "I Non-diagnostic.\nII Benign.\nIII AUS/FLUS.\nIV Follicular neoplasm.\nV Suspicious for malignancy.\nVI Malignant."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 25, "q": "What are the four types of thyrotoxic goitre listed in the source?", "a": "Graves' disease; toxic multinodular goitre; toxic adenoma; iodine-induced thyrotoxicosis."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 26, "q": "What are the six major types of thyroiditis?", "a": "Acute suppurative; subacute De Quervain; Hashimoto; silent/painless; drug-induced; Riedel's."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 27, "q": "How are thyroid malignancies classified by cell of origin?", "a": "Follicular cells → papillary, follicular, anaplastic.\nC cells → medullary.\nLymphocytes → lymphoma."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 28, "q": "Which mutations are classically associated with PTC, FTC, and MTC?", "a": "PTC → BRAF, RET/PTC.\nFTC → RAS, PAX8-PPARγ.\nMTC → RET."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 29, "q": "What do T, N and M represent in TNM staging?", "a": "T = tumour size/local invasion.\nN = regional nodes.\nM = distant metastasis."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 30, "q": "What causes primary, secondary and tertiary hyperparathyroidism?", "a": "Primary → adenoma.\nSecondary → CKD/vitamin D deficiency.\nTertiary → autonomous secretion after prolonged secondary hyperparathyroidism."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 31, "q": "What is the classic mnemonic for primary hyperparathyroidism?", "a": "Bones, stones, groans, moans."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 32, "q": "How is Cushing's syndrome investigated according to the source?", "a": "24-hour urinary free cortisol + low-dose dexamethasone suppression test → elevated/unsuppressed cortisol."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 33, "q": "What is Addison's disease and its main causes/features?", "a": "Primary adrenal insufficiency. Causes: autoimmune, TB, adrenal hemorrhage. Features: hypotension, hyperpigmentation, weight loss, fatigue."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 34, "q": "What are the classic features and tests for pheochromocytoma?", "a": "Headache, sweating, palpitations; ↑ plasma free metanephrines/urinary metanephrines; traditional Rule of 10s."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 35, "q": "What are four pancreatic NETs and their classic syndromes?", "a": "Insulinoma → Whipple triad.\nGastrinoma → Zollinger-Ellison.\nGlucagonoma → necrolytic migratory erythema.\nVIPoma → WDHA."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 36, "q": "What are MEN1, MEN2A and MEN2B?", "a": "MEN1 → parathyroid + pancreas + pituitary; MEN1 gene.\nMEN2A → MTC + pheochromocytoma + hyperparathyroidism; RET.\nMEN2B → MTC + pheochromocytoma + mucosal neuromas + marfanoid habitus; RET."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 37, "q": "What happens with unilateral RLN, bilateral RLN, and external SLN injury?", "a": "Unilateral RLN → hoarseness.\nBilateral RLN → stridor/airway obstruction.\nExternal SLN → weak voice/loss of high pitch."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 38, "q": "Why does a thyroglossal duct cyst move with swallowing and tongue protrusion?", "a": "Swallowing movement → laryngeal attachment. Tongue protrusion → persistent thyroglossal tract connection to tongue/hyoid."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 39, "q": "Why is the RLN–inferior thyroid artery relationship surgically important?", "a": "The RLN is closely related to the inferior thyroid artery, so it can be injured during ligation; branches should be ligated close to the thyroid capsule."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 40, "q": "Where does peripheral conversion of T4 to T3 occur?", "a": "T4 → T3 in liver, kidney and skeletal muscle by deiodinases."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 41, "q": "What are major physiological effects of thyroid hormones?", "a": "Cardiovascular: ↑HR, contractility, cardiac output.\nMetabolic: ↑BMR, O2 consumption, heat production.\nGIT: ↑motility."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 42, "q": "Why is TSH the most sensitive first-line screening test?", "a": "TSH has a log-linear relationship with FT4 and detects subclinical dysfunction early."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 43, "q": "How do hot and cold thyroid nodules differ on RAIU scan?", "a": "Hot → increased uptake, hyperfunctioning, very low malignancy risk.\nCold → decreased/absent uptake, higher malignancy risk."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 44, "q": "Why is thyroglobulin not a primary diagnostic test but useful after surgery?", "a": "Tg is nonspecific preoperatively; after total thyroidectomy it is a tumor marker for residual/recurrent differentiated thyroid cancer."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 45, "q": "What does serum calcitonin monitor?", "a": "Medullary thyroid carcinoma."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 46, "q": "How does nontoxic multinodular goitre develop?", "a": "Iodine deficiency → ↓T3/T4 → ↑TSH → hyperplasia → uneven proliferation → nodules → hemorrhage/cystic degeneration/fibrosis."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 47, "q": "Subtotal vs total thyroidectomy: key differences?", "a": "Subtotal → benign MNG; leaves remnant; recurrence risk.\nTotal → malignancy, bilateral disease, selected Graves; requires lifelong levothyroxine."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 48, "q": "How do acute suppurative and subacute De Quervain thyroiditis differ?", "a": "Acute suppurative: bacterial, high fever, painful, leukocytosis → antibiotics ± drainage.\nDe Quervain: post-viral, painful, high ESR/CRP, low RAIU → NSAIDs ± steroids."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 49, "q": "Compare Hashimoto, silent and Riedel thyroiditis.", "a": "Hashimoto: autoimmune, hypothyroidism, firm diffuse goitre.\nSilent: painless, transient hyper → hypo → recovery.\nRiedel: fibrosing, rock-hard fixed mass."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 50, "q": "Why can Riedel thyroiditis mimic anaplastic carcinoma?", "a": "Both can present as an invasive hard mass. Biopsy differentiates. Riedel → steroids/tamoxifen ± decompression; anaplastic → palliative multimodal treatment/airway management."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 51, "q": "How do Graves, toxic MNG and toxic adenoma cause hyperthyroidism?", "a": "Graves → TRAb stimulation.\nTMNG → multiple autonomous nodules.\nToxic adenoma → single autonomous nodule."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 52, "q": "How do methimazole and PTU work, and when is PTU preferred?", "a": "Thionamides inhibit TPO. Methimazole is generally preferred; PTU is preferred in the 1st trimester and in thyroid storm."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 53, "q": "What is the Wolff-Chaikoff effect and its clinical use?", "a": "High iodine temporarily suppresses thyroid hormone synthesis/release and reduces vascularity; Lugol's iodine/KI can be used preoperatively."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 54, "q": "PTC vs FTC: spread and histology?", "a": "PTC → lymphatic spread; papillae, Orphan Annie nuclei, nuclear grooves, psammoma bodies.\nFTC → hematogenous spread; capsular/vascular invasion."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 55, "q": "What is the general management of differentiated thyroid carcinoma >1 cm?", "a": "Appropriate thyroidectomy according to risk/extent ± RAI + levothyroxine with TSH suppression + thyroglobulin/anti-Tg + neck ultrasound."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 56, "q": "How is medullary thyroid carcinoma managed surgically?", "a": "Total thyroidectomy + appropriate central neck dissection. RAI is ineffective; follow with calcitonin/CEA."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 57, "q": "Why must pheochromocytoma be screened for before neck surgery in MTC?", "a": "MTC can occur with MEN2 and pheochromocytoma; treat/screen it first to prevent a potentially fatal catecholamine crisis."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 58, "q": "What are the laboratory patterns in primary, secondary and tertiary hyperparathyroidism?", "a": "Primary: ↑Ca, ↓PO4, ↑PTH.\nSecondary: ↓/normal Ca, ↑PO4 in CKD, ↑PTH.\nTertiary: ↑Ca, usually ↑PO4 in CKD, ↑↑PTH."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 59, "q": "What is the correct preoperative drug sequence for pheochromocytoma?", "a": "Alpha-blockade first → volume expansion → beta-blockade afterward if needed. Never give beta-blockade before alpha-blockade."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 60, "q": "How are insulinoma and gastrinoma diagnosed/treated?", "a": "Insulinoma → Whipple triad + 72-hour fast → enucleation/partial pancreatectomy.\nGastrinoma → fasting gastrin + secretin test → resection if localized."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 61, "q": "What is the diagnosis in the thyrotoxicosis case with pretibial skin changes?", "a": "Graves' disease + pretibial myxedema."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 62, "q": "What TFTs and antibody confirm Graves' disease?", "a": "↓TSH, ↑FT4, ↑FT3; confirm with TRAb/TSI."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 63, "q": "How is Graves' disease treated medically, and what changes in the first trimester?", "a": "Methimazole + beta-blocker; in the 1st trimester → PTU."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 64, "q": "What preoperative medications and surgery are used when Graves' medical therapy fails?", "a": "Thionamide + beta-blocker + Lugol/KI → total thyroidectomy."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 65, "q": "What is the immediate complication in the post-thyroidectomy patient with rapid neck swelling and airway distress?", "a": "Post-thyroidectomy compressive hematoma → immediate wound opening/evacuation + airway management + return to OR."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 66, "q": "What biochemical abnormality causes perioral tingling, cramps and spasms after thyroidectomy?", "a": "Hypocalcemia."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 67, "q": "Which two clinical signs demonstrate hypocalcemic neuromuscular excitability?", "a": "Chvostek's sign + Trousseau's sign."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 68, "q": "Why does hypocalcemia occur after thyroidectomy and how is severe disease treated?", "a": "Parathyroid removal/devascularization → hypoparathyroidism → severe cases: IV calcium gluconate; then oral calcium/calcitriol."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 69, "q": "What is the diagnostic pathway for a suspicious solitary thyroid nodule?", "a": "Neck ultrasound → US-guided FNA when indicated."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 70, "q": "What is the likely diagnosis with Bethesda VI in the radiation-exposed nodule case?", "a": "Papillary thyroid carcinoma → thyroidectomy according to extent/risk + therapeutic node dissection if involved."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 71, "q": "How is Bethesda IV managed and why can't FNA distinguish follicular adenoma from carcinoma?", "a": "Diagnostic hemithyroidectomy/lobectomy because FNA cannot assess capsular or vascular invasion."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 72, "q": "What is long-term follow-up after total thyroidectomy for differentiated thyroid cancer?", "a": "Levothyroxine/TSH suppression according to risk + Tg/anti-Tg + neck ultrasound ± RAI."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 73, "q": "What genetic syndrome links MTC, pheochromocytoma and hyperparathyroidism?", "a": "MEN2A → germline RET mutation."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 74, "q": "What are the cell/tissue origins of the three MEN2A tumors?", "a": "MTC → C cells.\nHyperparathyroidism → chief cells.\nPheochromocytoma → adrenal medulla chromaffin cells."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 75, "q": "Which tumor must be treated first in MEN2A before thyroid/parathyroid surgery?", "a": "Pheochromocytoma must be treated first → then thyroid/parathyroid surgery."}, {"subject": "Thyroid", "section": "All Thyroid Questions", "n": 76, "q": "What should first-degree relatives with the same RET mutation receive?", "a": "RET genetic testing → mutation-specific surveillance/prophylactic thyroidectomy according to RET risk category."}];
let subject=null, section='ALL', deck=[], idx=0, starred=new Set(JSON.parse(localStorage.getItem('medFlashStars')||'[]'));

function save(){localStorage.setItem('medFlashStars',JSON.stringify([...starred])); updateStarCounts();}
function updateStarCounts(){document.getElementById('homeStars').textContent='('+starred.size+')'; if(document.getElementById('starCount')) document.getElementById('starCount').textContent='★ '+starred.size+' starred';}
function goHome(){document.getElementById('study').style.display='none';document.getElementById('home').style.display='block';}
function openSubject(s){subject=s;section='ALL';document.getElementById('home').style.display='none';document.getElementById('study').style.display='block';document.getElementById('subjectTitle').textContent=s;renderFilters();build();}
function openStarred(){subject='STARRED';section='ALL';document.getElementById('home').style.display='none';document.getElementById('study').style.display='block';document.getElementById('subjectTitle').textContent='★ Starred questions';document.getElementById('filters').innerHTML='';build();}
function renderFilters(){
 const box=document.getElementById('filters'); box.innerHTML='';
 if(subject==='STARRED')return;
 const secs=[...new Set(DATA.filter(x=>x.subject===subject).map(x=>x.section))];
 const all=document.createElement('button');all.className='chip '+(section==='ALL'?'active':'');all.textContent='All topics';all.onclick=()=>{section='ALL';renderFilters();build()};box.appendChild(all);
 secs.forEach(s=>{const b=document.createElement('button');b.className='chip '+(section===s?'active':'');b.textContent=s;b.onclick=()=>{section=s;renderFilters();build()};box.appendChild(b)});
}
function build(){
 deck=subject==='STARRED'?DATA.filter(x=>starred.has(key(x))):DATA.filter(x=>x.subject===subject&&(section==='ALL'||x.section===section));
 idx=0;render();
}
function key(x){return x.subject+'-'+x.n}
function render(){
 const card=document.getElementById('card');card.classList.remove('flipped');
 const s=document.getElementById('stem');const star=document.getElementById('starBtn');
 if(!deck.length){document.getElementById('question').textContent='No starred questions yet.';document.getElementById('answer').textContent='Tap ★ on any question to save it for later.';document.getElementById('progressText').textContent='0 / 0';document.getElementById('fill').style.width='0%';s.classList.remove('show');star.style.display='none';return}
 star.style.display='block';const x=deck[idx];document.getElementById('qkicker').textContent='Question';document.getElementById('question').textContent=x.q;document.getElementById('answer').textContent=x.a;
 if(x.stem){s.textContent=x.stem;s.classList.add('show')}else{s.classList.remove('show')}
 star.classList.toggle('on',starred.has(key(x)));document.getElementById('progressText').textContent=(idx+1)+' / '+deck.length;document.getElementById('fill').style.width=((idx+1)/deck.length*100)+'%';updateStarCounts();
}
function flip(){if(deck.length)document.getElementById('card').classList.toggle('flipped')}
function next(){if(idx<deck.length-1){idx++;render()}}
function prev(){if(idx>0){idx--;render()}}
function shuffle(){for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}idx=0;render()}
document.getElementById('starBtn').onclick=(e)=>{e.stopPropagation();if(!deck.length)return;const k=key(deck[idx]);starred.has(k)?starred.delete(k):starred.add(k);save();render()};
document.addEventListener('keydown',e=>{if(document.getElementById('study').style.display==='none')return;if(e.key===' '){e.preventDefault();flip()}else if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')prev();else if(e.key.toLowerCase()==='s')document.getElementById('starBtn').click()});
updateStarCounts();
</script>
